<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="silverChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="darkSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="50%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#0e1014"/>
    </linearGradient>
    <radialGradient id="silverGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#silverGlow)"/>
  <circle cx="100" cy="100" r="82" fill="url(#darkSilverGrad)" stroke="url(#silverChrome)" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="74" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  <!-- Shield / Crest Shape -->
  <path d="M100 32 L146 56 V108 C146 138 126 162 100 172 C74 162 54 138 54 108 V56 Z" fill="none" stroke="url(#silverChrome)" stroke-width="2" stroke-opacity="0.5"/>
  <!-- D Symbol -->
  <path d="M78 62 h26 c18 0 32 12 32 38 s-14 38 -32 38 h-26 z M90 76 v48 h14 c10 0 18 -8 18 -24 s-8 -24 -18 -24 z" fill="url(#silverChrome)" filter="url(#shadow)"/>
  <!-- Moon Crescent -->
  <path d="M100 44 A 56 56 0 0 0 144 88 A 58 58 0 0 1 106 50 Z" fill="#cbd5e1" opacity="0.4"/>
  <!-- Stars -->
  <circle cx="100" cy="48" r="2.5" fill="#e2e8f0"/>
  <circle cx="70" cy="54" r="1.5" fill="#cbd5e1"/>
  <circle cx="130" cy="54" r="1.5" fill="#cbd5e1"/>
</svg>
